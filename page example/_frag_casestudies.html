<!-- ============================================================
     MCP page: "Use cases" block.
     A gallery after the client's Stripe "What's happening" reference: the open panel is wide,
     the next ones step down to slivers, the caption sits on the image, and the track loops.
     The six original client cases keep their titles and paragraphs, with Spectrum images.
     A separate image-only
     library below the cases holds all thirty generated scenes.
     ============================================================ -->
<style>
  /* --cg-dur: autoplay step, 6s per case */
  .cg{position:relative;z-index:1;--cg-dur:6s}

  /* arrows */
  .cg-nav{display:flex;gap:10px;flex:0 0 auto}
  .cg-btn{width:48px;height:48px;padding:0;border-radius:12px;border:1px solid #ffffff1f;background:#ffffff0a;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,opacity .2s}
  .cg-btn:hover{background:#ffffff14;border-color:#ebb2ff55}
  .cg-btn[disabled]{opacity:.32;cursor:default;background:#ffffff0a;border-color:#ffffff1f}
  .cg-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* the expanding track: the open panel is wide, the next ones step down, the ones already
     seen collapse to the left. Widths are set in px by the script. */
  /* pan-y: the page still scrolls vertically under a finger, horizontal swipes go to the gallery */
  .cg-track{display:flex;height:460px;overflow:hidden;touch-action:pan-y}
  .cg-item{position:relative;flex:0 0 auto;height:100%;border-radius:16px;overflow:hidden;cursor:pointer;background:#1d1d28;outline:none;transition:width .7s cubic-bezier(.65,0,.35,1),margin .7s cubic-bezier(.65,0,.35,1)}
  .cg-track:not(.is-ready) .cg-item{width:0}
  .cg-track:not(.is-ready) .cg-item:first-child{width:100%}
  /* switched on for one frame when the loop jumps between copies, so the jump is invisible */
  .cg-noanim .cg-item,.cg-noanim .cg-item img,.cg-noanim .cg-item::before,.cg-noanim .cg-over{transition:none!important}
  .cg-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.06);transition:transform 1.2s cubic-bezier(.3,0,.2,1)}
  .cg-item.is-active{cursor:default}
  .cg-item.is-active img{transform:scale(1)}
  .cg-item::before{content:"";position:absolute;inset:0;z-index:1;background:#0b0b12;opacity:.38;transition:opacity .4s;pointer-events:none}
  .cg-item.is-active::before{opacity:0}
  .cg-item:not(.is-active):hover::before{opacity:.12}
  .cg-item::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;box-shadow:inset 0 0 0 1px #ffffff14;pointer-events:none}
  .cg-item:focus-visible::after{box-shadow:inset 0 0 0 2px #ebb2ff}

  /* caption on the image, controls under the gallery */
  /* Every caption gets the height of the longest one (--cg-over-h, measured by the script) and
     lays out at the open panel's width (--cg-act-w), so titles sit on one line across slides,
     the text follows right under the title, and shorter cases simply leave room at the bottom. */
  .cg-over{position:absolute;left:0;bottom:0;z-index:2;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;min-width:var(--cg-act-w,640px);width:100%;height:var(--cg-over-h,auto);padding:110px 34px 30px;background:linear-gradient(180deg,transparent,#0b0b12d9 62%);opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease;pointer-events:none}
  .cg-item.is-active .cg-over{opacity:1;transform:none;transition-delay:.4s}
  .cg-over h3{margin:0 0 8px;max-width:620px;color:#fff;font-size:24px;line-height:32px;font-weight:600;text-wrap:balance}
  .cg-over p{margin:0;max-width:620px;color:#c6c7cc;font-size:15px;line-height:24px}
  .cg-ctrl{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:24px}
  .cg-prog{display:flex;align-items:center;gap:18px;flex:1;max-width:520px}
  .cg-count{flex:0 0 auto;color:#959599;font-size:13px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
  .cg-dots{display:flex;gap:6px;flex:1}
  /* the active bar fills over one autoplay step; its animationend is what moves the gallery,
     so pausing the fill (hover, focus, off-screen, hidden tab) pauses the gallery too */
  .cg-dot{position:relative;overflow:hidden;flex:1;height:3px;padding:0;border:0;border-radius:3px;background:#ffffff1a;cursor:pointer;transition:background .3s}
  .cg-dot:hover{background:#ffffff33}
  .cg-dot.is-on{background:#ffffff26}
  .cg-dot::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;background:linear-gradient(90deg,#71a1ff,#ef68f2)}
  .cg-dot.is-on::after{animation:cg-fill var(--cg-dur) linear forwards}
  .cg-paused .cg-dot.is-on::after{animation-play-state:paused}
  .cg-static .cg-dot.is-on::after{animation:none;width:100%}
  @keyframes cg-fill{from{width:0}to{width:100%}}

  /* Independent image library; category tabs never control the use-case carousel. */
  .mc-image-library{padding-top:0;scroll-margin-top:100px}
  .mc-image-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
  .mc-image-tabs button{border:1px solid #ffffff14;background:transparent;color:#959599;font:inherit;font-size:13px;line-height:20px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .mc-image-tabs button[aria-selected="true"]{background:#71a1ff1f;border-color:#71a1ff40;color:#dfe7ff}
  .mc-image-tabs button:hover{color:#fff;background:#ffffff0a}
  .mc-image-tabs button:focus-visible,.mc-image-library [role="tabpanel"]:focus-visible{outline:2px solid #acbaff;outline-offset:4px}
  .mc-image-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .mc-image-grid img{box-sizing:border-box;display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border:1px solid #ffffff14;border-radius:16px;background:#0e0e14}
  .mc-image-grid img[hidden]{display:none}
  @media(max-width:991px){.mc-image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

  @media(max-width:767px){
    .cg-track{height:420px;height:max(420px,calc(var(--cg-over-h,340px) + 60px))}
    .cg-over{padding:80px 20px 20px}
    .cg-over h3{font-size:19px;line-height:26px}
    .cg-over p{font-size:14px;line-height:22px}
    .cg-prog{gap:12px;min-width:0}
    .cg-dots{gap:3px}
    .cg-ctrl{gap:16px}
    .cg-nav{gap:6px}
    .cg-btn{width:40px;height:40px}
    .mc-image-grid{gap:12px}
    .mc-image-grid img{border-radius:12px}
    .mc-image-tabs{gap:6px}
    .mc-image-tabs button{font-size:12px;padding:7px 12px}
  }
  @media(prefers-reduced-motion:reduce){.cg *,.cg *::before,.cg *::after,.mc-image-tabs button{transition:none!important}}
</style>
