<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400">
  <defs>
    <radialGradient id="hub-fill" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#3a2f5e"/>
      <stop offset="100%" stop-color="#1f1c2b"/>
    </radialGradient>
    <linearGradient id="hub-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5485e5"/>
      <stop offset="50%" stop-color="#fb63ff"/>
      <stop offset="100%" stop-color="#9468f2"/>
    </linearGradient>
    <radialGradient id="agent-fill" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#2d2a45"/>
      <stop offset="100%" stop-color="#1b1921"/>
    </radialGradient>
    <filter id="glow-blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="fade-g" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"  stop-color="white" stop-opacity="0"/>
      <stop offset="10%" stop-color="white" stop-opacity="1"/>
      <stop offset="86%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade-mask">
      <rect width="460" height="400" fill="url(#fade-g)"/>
    </mask>
  </defs>

  <g mask="url(#fade-mask)">

    <!-- hub glow -->
    <circle cx="230" cy="200" r="53" fill="#9468f2" opacity="0.25" filter="url(#glow-blur)">
      <animate attributeName="opacity" values="0.22;0.38;0.22" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="r"       values="53;65;53"         dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <circle cx="230" cy="200" r="40" fill="#71a1ff" opacity="0.12" filter="url(#glow-blur)">
      <animate attributeName="opacity" values="0.10;0.20;0.10" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>

    <!-- lines top: solid blue, orthogonal elbows -->
    <path fill="none" stroke="#71a1ff" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"
          d="M100 87 L100 109 Q100 121 112 121 L218 121 Q230 121 230 133 L230 147"/>
    <path fill="none" stroke="#71a1ff" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"
          d="M230 87 L230 147"/>
    <path fill="none" stroke="#71a1ff" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"
          d="M360 87 L360 109 Q360 121 348 121 L242 121 Q230 121 230 133 L230 147"/>

    <!-- lines bottom: dashed animated, start below "Makini MCP" label -->
    <path fill="none" stroke="white" stroke-opacity="0.25" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7"
          d="M230 276 L230 282 Q230 290 222 290 L98 290 Q90 290 90 305 L90 319">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
    </path>
    <path fill="none" stroke="white" stroke-opacity="0.25" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7"
          d="M230 276 L230 282 Q230 290 222 290 L191 290 Q183 290 183 305 L183 319">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
    </path>
    <path fill="none" stroke="white" stroke-opacity="0.25" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7"
          d="M230 276 L230 282 Q230 290 238 290 L269 290 Q277 290 277 305 L277 319">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
    </path>
    <path fill="none" stroke="white" stroke-opacity="0.25" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7"
          d="M230 276 L230 282 Q230 290 238 290 L362 290 Q370 290 370 305 L370 319">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
    </path>

    <!-- animated dots: agents → hub -->
    <circle r="3" fill="#71a1ff">
      <animateMotion dur="1.5s" repeatCount="indefinite" path="M100 87 L100 109 Q100 121 112 121 L218 121 Q230 121 230 133 L230 147"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#71a1ff">
      <animateMotion dur="1.5s" begin="-0.5s" repeatCount="indefinite" path="M230 87 L230 147"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.5s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#71a1ff">
      <animateMotion dur="1.5s" begin="-1s" repeatCount="indefinite" path="M360 87 L360 109 Q360 121 348 121 L242 121 Q230 121 230 133 L230 147"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.5s" begin="-1s" repeatCount="indefinite"/>
    </circle>

    <!-- animated dots: hub → systems -->
    <circle r="2.5" fill="#9468f2">
      <animateMotion dur="1.6s" begin="-0.2s" repeatCount="indefinite" path="M230 276 L230 282 Q230 290 222 290 L98 290 Q90 290 90 305 L90 319"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="1.6s" begin="-0.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#9468f2">
      <animateMotion dur="1.4s" begin="-0.7s" repeatCount="indefinite" path="M230 276 L230 282 Q230 290 222 290 L191 290 Q183 290 183 305 L183 319"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="1.4s" begin="-0.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#9468f2">
      <animateMotion dur="1.6s" begin="-1.1s" repeatCount="indefinite" path="M230 276 L230 282 Q230 290 238 290 L269 290 Q277 290 277 305 L277 319"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#9468f2">
      <animateMotion dur="1.8s" begin="-0.4s" repeatCount="indefinite" path="M230 276 L230 282 Q230 290 238 290 L362 290 Q370 290 370 305 L370 319"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>

