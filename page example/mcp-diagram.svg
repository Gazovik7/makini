<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="500" height="340" viewBox="0 0 500 340" fill="none" role="img"
     aria-label="Your agent connects through Makini MCP to your systems">

  <defs>
    <!-- hub fill + gradient border + pulsing glow -->
    <radialGradient id="hubFill" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#3a2f5e"/>
      <stop offset="1" stop-color="#1f1c2b"/>
    </radialGradient>
    <linearGradient id="hubBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"  stop-color="#5485e5"/>
      <stop offset=".5" stop-color="#fb63ff"/>
      <stop offset="1"  stop-color="#9468f2"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#9468f2" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#71a1ff" stop-opacity=".22"/>
      <stop offset="1"   stop-color="#71a1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="agentFill" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#262431"/>
      <stop offset="1" stop-color="#1b1921"/>
    </radialGradient>

    <style>
      text{font-family:Inter,-apple-system,"Segoe UI",sans-serif}
      /* animated dashed branches: hub -> systems + logo slot */
      .ctag-flow{stroke-dasharray:5 7;animation:ctagDash 1.2s linear infinite}
      @keyframes ctagDash{to{stroke-dashoffset:-24}}
      /* pulsing glow behind the hub */
      .hub-glow{transform-box:fill-box;transform-origin:center;animation:hubPulse 3s ease-in-out infinite}
      @keyframes hubPulse{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){
        .ctag-flow{animation:none}
        .hub-glow{animation:none}
        .ctag-dot{display:none}
      }
    </style>
  </defs>

  <!-- ============ CONNECTORS ============ -->
  <!-- solid link  agent -> hub  + travelling dot -->
  <path d="M91 170 L155 170" stroke="#71a1ff" stroke-width="2" stroke-linecap="round"/>
  <circle class="ctag-dot" cy="170" r="3.2" fill="#71a1ff">
    <animate attributeName="cx" values="93;153" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- dashed branches  hub -> logo slot + 4 systems -->
  <path class="ctag-flow" d="M263 170 L410 170" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.6" stroke-linecap="round"/>
  <path class="ctag-flow" d="M263 170 L308 170 Q320 170 320 158 L320 66 Q320 54 332 54 L388 54" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.6" stroke-linecap="round"/>
  <path class="ctag-flow" d="M263 170 L308 170 Q320 170 320 158 L320 114 Q320 102 332 102 L405 102" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.6" stroke-linecap="round"/>
  <path class="ctag-flow" d="M263 170 L308 170 Q320 170 320 182 L320 238 Q320 250 332 250 L405 250" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.6" stroke-linecap="round"/>
  <path class="ctag-flow" d="M263 170 L308 170 Q320 170 320 182 L320 286 Q320 298 332 298 L388 298" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ============ AGENT (robot) ============ -->
  <rect x="29" y="139" width="62" height="62" rx="16" fill="url(#agentFill)" stroke="#ffffff" stroke-opacity=".12"/>
  <g transform="translate(45 155) scale(1.25)" fill="none" stroke="#dfe7ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="7" width="14" height="11" rx="3"/>
    <path d="M12 7V4M9 12h.01M15 12h.01M9 18v2M15 18v2"/>
  </g>
  <text x="60" y="224" font-size="11" font-weight="500" fill="#9a9ba6" text-anchor="middle">Your agent</text>

  <!-- ============ MAKINI HUB ============ -->
  <ellipse class="hub-glow" cx="210" cy="170" rx="82" ry="82" fill="url(#hubGlow)"/>
  <rect x="157" y="117" width="106" height="106" rx="26" fill="url(#hubFill)"/>
  <rect x="157.75" y="117.75" width="104.5" height="104.5" rx="25.25" fill="none" stroke="url(#hubBorder)" stroke-width="1.5"/>
  <!-- Makini mark: four slanted bars -->
  <g transform="translate(210 170)" fill="#ffffff">
    <g transform="skewX(-12)">
      <rect x="-23" y="-18" width="7" height="36" rx="2"/>
      <rect x="-10" y="-18" width="7" height="36" rx="2"/>
      <rect x="3"   y="-18" width="7" height="36" rx="2"/>
      <rect x="16"  y="-18" width="7" height="36" rx="2"/>
    </g>
  </g>
  <text x="210" y="248" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Makini MCP</text>

  <!-- ============ EMPTY LOGO SLOT (was "SAP EWM") ============ -->
  <!-- 66x66 tile centred at (445,170). Drop your own logo on top of this rect,
       or replace the placeholder below with: <image x="416" y="141" width="58" height="58" xlink:href="your-logo.png"/> -->
  <rect id="logo-slot" x="412" y="137" width="66" height="66" rx="16"
        fill="#ffffff0a" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="4 4"/>
  <!-- <image x="416" y="141" width="58" height="58" preserveAspectRatio="xMidYMid meet" xlink:href="your-logo.png"/> -->
  <text x="445" y="225" font-size="11" font-weight="500" fill="#9a9ba6" text-anchor="middle">Your logo</text>

  <!-- ============ SMALL SYSTEM ICONS ============ -->
  <!-- s1 -->
  <rect x="369" y="33" width="42" height="42" rx="12" fill="#ffffff0d" stroke="#ffffff" stroke-opacity=".11"/>
  <g transform="translate(379 43) scale(.9167)" fill="none" stroke="#aeb0c0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
    <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
  </g>
  <!-- s2 -->
  <rect x="391" y="81" width="42" height="42" rx="12" fill="#ffffff0d" stroke="#ffffff" stroke-opacity=".11"/>
  <g transform="translate(401 91) scale(.9167)" fill="none" stroke="#aeb0c0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <!-- s3 -->
  <rect x="391" y="229" width="42" height="42" rx="12" fill="#ffffff0d" stroke="#ffffff" stroke-opacity=".11"/>
  <g transform="translate(401 239) scale(.9167)" fill="none" stroke="#aeb0c0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 12h6M9 16h6"/>
  </g>
  <!-- s4 -->
  <rect x="369" y="277" width="42" height="42" rx="12" fill="#ffffff0d" stroke="#ffffff" stroke-opacity=".11"/>
  <g transform="translate(379 287) scale(.9167)" fill="none" stroke="#aeb0c0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
  </g>

</svg>
