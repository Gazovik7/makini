<style>
    .mc-cta-graphic {
        position: relative;
        width: 500px;
        height: 340px;
        display: block;
        max-width: 100%;
    }

    .ctag-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
    }

    .ctag-flow {
        stroke-dasharray: 5 7;
        animation: ctagDash 1.2s linear infinite;
    }

    @keyframes ctagDash {
        to {
            stroke-dashoffset: -24;
        }
    }

    .ctag-node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        z-index: 2;
    }

    .ctag-agent {
        left: 60px;
        top: 170px;
        width: 62px;
        height: 62px;
        border-radius: 8px;
        background: radial-gradient(circle at 30% 20%, #26243150, #1b1921);
        border: 1px solid #ffffff1f;
        color: #dfe7ff;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
    }

    .ctag-agent svg {
        width: 30px;
        height: 30px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .ctag-hub {
        left: 210px;
        top: 170px;
        width: 106px;
        height: 106px;
        border-radius: 12px;
        background: radial-gradient(circle at 30% 20%, #3a2f5e, #1f1c2b);
        box-shadow: 0 0 75px #9468f255, 0 0 34px #71a1ff44;
        animation: ctagHubPulse 3s ease-in-out infinite;
    }

    .ctag-hub::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 12px;
        padding: 1.5px;
        background: linear-gradient(135deg, #5485e5, #fb63ff, #9468f2);
        -webkit-mask: linear-gradient(#000 0 0) content-box,
            linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }

    .ctag-hub svg {
        width: 52px;
        height: 52px;
        position: relative;
        z-index: 1;
    }

    @keyframes ctagHubPulse {

        0%,
        100% {
            box-shadow: 0 0 75px #9468f255, 0 0 34px #71a1ff44;
        }

        50% {
            box-shadow: 0 0 95px #9468f277, 0 0 46px #71a1ff66;
        }
    }

    /* START блок под изображенице из cms  */
    .ctag-sap {
        left: 445px;
        top: 170px;
        width: 66px;
        height: 66px;
        border-radius: 8px;
        overflow: hidden;
    }

    .ctag-sap img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
    }

    /* END блок под изображенице из cms  */

    .ctag-sys {
        width: 42px;
        height: 42px;
        border-radius: 6px;
        background: #ffffff0d;
        border: 1px solid #ffffff1c;
        color: #aeb0c0;
    }

    .ctag-sys svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .ctag-s1 {
        left: 390px;
        top: 54px;
    }

    .ctag-s2 {
        left: 412px;
        top: 102px;
    }

    .ctag-s3 {
        left: 412px;
        top: 250px;
    }

    .ctag-s4 {
        left: 390px;
        top: 298px;
    }

    .ctag-label {
        position: absolute;
        transform: translateX(-50%);
        font-size: 11px;
        font-weight: 500;
        color: #9a9ba6;
        white-space: nowrap;
        z-index: 2;
    }

    .ctag-lab-agent {
        left: 60px;
        top: 212px;
    }

    .ctag-lab-hub {
        left: 210px;
        top: 236px;
        color: #fff;
        font-weight: 600;
    }

    .ctag-lab-sap {
        left: 445px;
        top: 205px;
    }

    @media (max-width: 560px) {
        .mc-cta-graphic {
            transform: scale(0.78);
            transform-origin: center;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .ctag-flow {
            animation: none;
        }

        .ctag-hub {
            animation: none;
        }

        .ctag-dot {
            display: none;
        }
    }
</style>
